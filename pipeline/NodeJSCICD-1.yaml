pipeline:
  id: NodeJSCICD_1
  name: NodeJSCICD-1
  description: Build the Node.js app image, push it to Docker Hub, and deploy it to the local Kubernetes cluster.
  clone:
    enabled: true
    connector: httpsgithubcomgsd00110110harness_demo
    repo: gsd00110110/harness-demo
    ref:
      type: branch
      name: main
  stages:
    - id: build
      name: Build and Push
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: build_and_push
          name: Build and Push Image
          build:
            uses: buildAndPushToDocker
            with:
              connector: httpshubdockercomrepositorydockergsd00110110harnessgeneral
              repo: gsd00110110/harness
              tags:
                - v7
    - id: approve_deploy
      name: Approve Deployment
      type: Approval
      spec:
        execution:
          steps:
            - id: manual_approval
              name: Manual Approval
              type: HarnessApproval
              spec:
                approvalMessage: Please review and approve the deployment to local Kubernetes.
                includeQRCode: false
                approvers:
                  userGroups:
                    - approvers_group
                  minimumCount: 1
                  disallowPipelineInitiator: false
                executionTimeout: 1d
    - id: deploy
      name: Deploy to Local K8s
      service:
        items:
          - nodeapp
      environment:
        items:
          - id: local_k8s
            deploy-to: local_k8s_infra
      runtime:
        kubernetes:
          connector: connector_K8sCluster_a5eb
          namespace: nodeapp
      steps:
        - id: k8sRollingDeployStep
          name: Kubernetes Rolling Deploy
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            id: k8sRollingRollback
            name: Kubernetes Rolling Rollback
            steps:
              - id: k8sRollingRollbackStep
                name: Kubernetes Rolling Rollback
                template:
                  uses: k8sRollingRollbackStep
      on-failure:
        errors: all
        action: stage-rollback