pipeline:
  id: NodeJSCICD_1
  name: NodeJSCICD-1
  description: Build the Node.js app image, push it to Docker Hub, require manual approval, and deploy it to the local Kubernetes cluster.
  clone:
    enabled: true
    connector: httpsgithubcomgsd00110110harness_demo
    repo: gsd00110110/harness-demo
    ref:
      type: branch
      name: main
  stages:
    steps:
    - id: get_tags
      run:
        container:
          image: alpine:3.20   # needs curl and jq; install them in the script if missing
        script: |-
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/gsd00110110/harness/tags?page_size=100" | jq -r '.results[].name' | grep '^v[0-9]*$' | sort -Vr)
          TAG1=$(echo "$TAGS" | sed -n '1p'); TAG2=$(echo "$TAGS" | sed -n '2p')
          NEXT_TAG="v$(( $(echo "$TAG1" | sed 's/v//') + 1 ))"
          export TAG1 TAG2 NEXT_TAG
        output:
          - name: TAG1
          - name: TAG2
          - name: NEXT_TAG

    - id: build
      name: Build and Push
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: build_and_push
          name: Build and Push Image
          build:
            uses: buildAndPushToDocker
            with:
              connector: httpshubdockercomrepositorydockergsd00110110harnessgeneral
              repo: gsd00110110/harness
              tags: 
                - ${{ stages.get_tags.output.NEXT_TAG }}
           
    - id: approve_deploy
      name: Approve Deployment
      steps:
        - id: manual_approval
          name: Manual Approval
          timeout: 1d
          approval:
            uses: harness
            with:
              message: Please select the target environment and review/approve the deployment.
              user-groups:
                - approvers_group
              approvers-min-count: 1
              block-executor: false
              inputs:
                env_name:
                  description: Select the deployment environment
                  enum:
                    - dev
                    - qa
                    - prod
                  required: true
                deploy_tag:
                  description: Select Docker image tag
                  required: true
                  enum:
                    - ${{ stages.get_tags.output.NEXT_TAG }}
                    - ${{ stages.get_tags.output.TAG1 }}
                    - ${{ stages.get_tags.output.TAG2 }}

    - id: deploy
      name: Deploy to Local K8s
      service:
        items:
          - id: nodeapp
      environment:
        items:
          - id: local_k8s
            deploy-to: local_k8s_infra
      runtime:
        kubernetes:
          connector: connector_K8sCluster_a5eb
          namespace: nodeapp
      steps:
        - id: k8sRollingDeployStep
          name: Kubernetes Rolling Deploy
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            id: k8sRollingRollback
            name: Kubernetes Rolling Rollback
            steps:
              - id: k8sRollingRollbackStep
                name: Kubernetes Rolling Rollback
                template:
                  uses: k8sRollingRollbackStep
          id: group_1
          name: group_1
      on-failure:
        errors: all
        action: stage-rollback
