pipeline:
  id: deployment_s3
  name: deployment-s3
  description: Check out the GitHub repository and upload the raw-data folder to AWS S3.
  tags:
    ai_generated: ""
  inputs:
    aws_connector:
      type: connector
      required: true
      description: AWS connector used to upload to S3
  clone:
    enabled: true
    connector: httpsgithubcomgsd00110110harness_demo
    repo: gsd00110110/harness-demo
    ref:
      type: branch
      name: main
  stages:
    - id: deploy
      name: deploy
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      steps:
        - id: upload_to_s3
          name: Upload to S3
          build:
            uses: uploadArtifactsToS3
            with:
              connector: ${{ inputs.aws_connector }}
              region: us-east-1
              bucket: my-demo-bucket
              source: raw-data/**
